name: Render Guardian Video

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: remotion
        run: bun install

      - name: Render video
        working-directory: remotion
        run: |
          bunx remotion render src/index.ts GuardianVideo \
            ../out/guardian_oficial.mp4 \
            --concurrency=4

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: guardian-video
          path: out/guardian_oficial.mp4
          retention-days: 7